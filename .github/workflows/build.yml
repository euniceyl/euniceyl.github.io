name: Build

env:
  NODE_VERSION: '22'

on:
  # Standalone trigger for PR validation
  pull_request:
    branches: ['main']
  # Reusable workflow trigger - called by deploy.yml
  workflow_call:
    outputs:
      artifact-id:
        description: 'The ID of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact-id }}
  # Allow manual trigger for testing
  workflow_dispatch:

# Read-only permissions for security
permissions:
  contents: read

# Prevent duplicate builds for the same PR
concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        # Fetch history for Hugo's .GitInfo and .Lastmod
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Get Hugo Version
      id: hugo-version
      run: |
        # Install pinned yq version for robust YAML parsing
        YQ_VERSION="v4.44.1"
        if ! wget -q --tries=3 --waitretry=1 -O /tmp/yq \
          "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"; then
          echo "::error::Failed to download yq"
          exit 1
        fi
        sudo mv /tmp/yq /usr/local/bin/yq
        sudo chmod +x /usr/local/bin/yq
        
        # Read hugo_version from hugoblox.yaml
        VERSION=$(yq '.build.hugo_version // ""' hugoblox.yaml 2>/dev/null | grep -v '^null$' || true)
        
        # Fallback to a known stable version if not specified
        DEFAULT_VERSION="0.161.1"
        VERSION=${VERSION:-$DEFAULT_VERSION}
        
        # Validate version format (basic check)
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::warning::Invalid hugo_version format '$VERSION', using default $DEFAULT_VERSION"
          VERSION="$DEFAULT_VERSION"
        fi
        
        echo "HUGO_VERSION=$VERSION" >> $GITHUB_ENV
        echo "Using Hugo version: $VERSION"

    - name: Install dependencies
      if: hashFiles('package.json') != ''
      run: npm ci --include=optional

    - name: Verify Linux native dependencies
      if: hashFiles('package.json') != ''
      run: |
        node -e "require.resolve('@tailwindcss/cli/package.json')"
        for pkg in \
          @pagefind/linux-x64 \
          @parcel/watcher-linux-x64-glibc \
          @tailwindcss/oxide-linux-x64-gnu \
          lightningcss-linux-x64-gnu; do
          node -e "require.resolve('${pkg}/package.json')" || {
            echo "::error title=Missing ${pkg}::Linux CI needs this optional dependency for Hugo builds."
            exit 1
          }
        done

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: ${{ env.HUGO_VERSION }}
        extended: true

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v5

    - name: Build with Hugo
      env:
        HUGO_ENVIRONMENT: production
        HUGO_BLOX_LICENSE: ${{ secrets.HUGO_BLOX_LICENSE }}
      run: |
        rm -rf resources
        hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
        if [ ! -f public/index.html ]; then
          echo "::error::Hugo did not generate public/index.html — homepage build failed."
          exit 1
        fi
        if grep -q "The Academic CV That Gets You Hired" public/index.html; then
          echo "::error::Homepage contains template README content instead of your custom site."
          exit 1
        fi
        touch public/.nojekyll

    - name: Generate Pagefind search index (if applicable)
      run: |
        # Use the locally installed pagefind binary (npx tries to re-download and fails on CI)
        if [ -f "package.json" ] && grep -q "pagefind" package.json; then
          npm run pagefind
        fi

    - name: Upload artifact
      id: upload
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./public
